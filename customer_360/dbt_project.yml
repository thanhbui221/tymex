
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'customer_360'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'customer_360'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  # Activity status thresholds (days since last activity)
  active_days_threshold: 90
  at_risk_days_threshold: 180

  # Transaction value segmentation thresholds
  high_value_transaction_threshold: 150000
  medium_value_transaction_threshold: 50000

  # Premium segment minimum transaction value
  premium_transaction_threshold: 100000

  # CRM engagement thresholds (interaction count)
  highly_engaged_interaction_threshold: 10
  moderately_engaged_interaction_threshold: 3

  # Customer lifecycle stage thresholds (days since signup)
  lifecycle_new_days: 90
  lifecycle_growing_days: 365
  lifecycle_established_days: 1095


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
tests:
  +store_failures: true

models:
  customer_360:
    bronze:
      +materialized: view
    silver:
      silver_customers:
        +materialized: table
      silver_customer_products:
        +materialized: table
      silver_customer_interactions:
        +materialized: incremental
        +unique_key: customer_id
        +incremental_strategy: merge
      silver_customer_transactions:
        +materialized: incremental
        +unique_key: customer_id
        +incremental_strategy: merge
    gold:
      customer_360:
        +materialized: table
